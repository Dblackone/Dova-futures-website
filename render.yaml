services:
  - type: web
    name: dova-futures-website
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    domains:
      - dovafutures.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTACT_TO_EMAIL
        value: info@dovafutures.com
      - key: CONTACT_FROM_EMAIL
        value: no-reply@dovafutures.com
      - key: CONTACT_ALLOWED_ORIGINS
        value: https://dovafutures.com,https://www.dovafutures.com
      - key: CONTACT_RATE_LIMIT
        value: 5
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
